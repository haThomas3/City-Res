<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Rubik, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8fa6e0"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#121829"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <text x="30" y="52" font-size="26" font-weight="700" fill="#e6eeff">Naive RAG agent in n8n · one workflow, two triggers, one index</text>
  <text x="30" y="78" font-size="14" fill="#8fa6e0">Documents go in through a form; questions come in through a chat; the agent decides when to search Pinecone</text>

  <!-- lane 1: ingest -->
  <text x="30" y="122" font-size="14" font-weight="700" fill="#4fc79a">1 · ADD DOCUMENTS</text>
  <g text-anchor="middle">
    <rect x="30" y="136" width="200" height="96" rx="12" fill="#173a2e" stroke="#4fc79a" stroke-width="2.5"/>
    <text x="130" y="172" font-size="15" font-weight="700" fill="#dffff0">Upload form</text>
    <text x="130" y="196" font-size="12" fill="#a6dcc4">n8n form trigger,</text>
    <text x="130" y="214" font-size="12" fill="#a6dcc4">a file per submission</text>

    <rect x="270" y="136" width="200" height="96" rx="12" fill="#232d4d" stroke="#5b6b96" stroke-width="2"/>
    <text x="370" y="172" font-size="15" font-weight="700" fill="#e6eeff">Data loader</text>
    <text x="370" y="196" font-size="12" fill="#a9b8d8">reads the file</text>
    <text x="370" y="214" font-size="12" fill="#a9b8d8">into plain text</text>

    <rect x="510" y="136" width="220" height="96" rx="12" fill="#232d4d" stroke="#5b6b96" stroke-width="2"/>
    <text x="620" y="172" font-size="15" font-weight="700" fill="#e6eeff">Recursive splitter</text>
    <text x="620" y="196" font-size="12" fill="#a9b8d8">cuts the text into chunks</text>
    <text x="620" y="214" font-size="12" fill="#a9b8d8">on paragraph, line, word</text>

    <rect x="770" y="136" width="200" height="96" rx="12" fill="#3a2e14" stroke="#f0b84d" stroke-width="2.5"/>
    <text x="870" y="172" font-size="15" font-weight="700" fill="#fff2d6">OpenAI embeddings</text>
    <text x="870" y="196" font-size="12" fill="#e8cf9c">one vector</text>
    <text x="870" y="214" font-size="12" fill="#e8cf9c">per chunk</text>

    <rect x="1010" y="136" width="240" height="96" rx="12" fill="#2b2440" stroke="#a46bff" stroke-width="2.5"/>
    <text x="1130" y="172" font-size="15" font-weight="700" fill="#f0e6ff">Pinecone index</text>
    <text x="1130" y="196" font-size="12" fill="#c9b3e8">stores the vectors</text>
    <text x="1130" y="214" font-size="12" fill="#c9b3e8">with the chunk text</text>
  </g>
  <g stroke="#8fa6e0" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M230 184H268"/>
    <path d="M470 184H508"/>
    <path d="M730 184H768"/>
    <path d="M970 184H1008"/>
  </g>

  <!-- lane 2: answer -->
  <text x="30" y="302" font-size="14" font-weight="700" fill="#38c6e8">2 · ASK A QUESTION</text>
  <g text-anchor="middle">
    <rect x="30" y="316" width="200" height="110" rx="12" fill="#1e3046" stroke="#38c6e8" stroke-width="2.5"/>
    <text x="130" y="354" font-size="15" font-weight="700" fill="#dff7ff">Chat message</text>
    <text x="130" y="378" font-size="12" fill="#a8d8e8">n8n chat trigger,</text>
    <text x="130" y="396" font-size="12" fill="#a8d8e8">the user's question</text>

    <rect x="270" y="316" width="300" height="110" rx="12" fill="#232d4d" stroke="#5b6b96" stroke-width="2"/>
    <text x="420" y="350" font-size="15" font-weight="700" fill="#e6eeff">AI agent</text>
    <text x="420" y="374" font-size="12" fill="#a9b8d8">chat model through OpenRouter</text>
    <text x="420" y="392" font-size="12" fill="#a9b8d8">decides when to call its search tool,</text>
    <text x="420" y="410" font-size="12" fill="#a9b8d8">then writes the answer</text>

    <rect x="610" y="316" width="300" height="110" rx="12" fill="#2b2440" stroke="#a46bff" stroke-width="2.5"/>
    <text x="760" y="350" font-size="15" font-weight="700" fill="#f0e6ff">Pinecone search tool</text>
    <text x="760" y="374" font-size="12" fill="#c9b3e8">embeds the question with the</text>
    <text x="760" y="392" font-size="12" fill="#c9b3e8">same OpenAI model, returns the</text>
    <text x="760" y="410" font-size="12" fill="#c9b3e8">closest chunks to the agent</text>

    <rect x="950" y="316" width="300" height="110" rx="12" fill="#173a2e" stroke="#4fc79a" stroke-width="2.5"/>
    <text x="1100" y="354" font-size="15" font-weight="700" fill="#dffff0">Answer in the chat</text>
    <text x="1100" y="378" font-size="12" fill="#a6dcc4">based on the chunks</text>
    <text x="1100" y="396" font-size="12" fill="#a6dcc4">the tool found</text>
  </g>
  <g stroke="#8fa6e0" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M230 371H268"/>
    <path d="M570 360H608"/>
    <path d="M608 384H572"/>
    <path d="M420 426V470H1100V428"/>
  </g>
  <g stroke="#8fa6e0" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <path d="M1130 232V300H760V314"/>
  </g>
  <text x="945" y="292" font-size="12" fill="#8fa6e0" text-anchor="middle">same index</text>
  <text x="760" y="490" font-size="12" fill="#8fa6e0" text-anchor="middle">the agent answers with what the tool returned</text>

  <rect x="30" y="530" width="1220" height="80" rx="12" fill="#1a2138" stroke="#3b4770" stroke-width="1.5"/>
  <text x="640" y="562" font-size="14" fill="#a9b8d8" text-anchor="middle">"Naive" RAG: retrieve, then answer. No reranking step and no chat memory connected to the agent,</text>
  <text x="640" y="586" font-size="14" fill="#a9b8d8" text-anchor="middle">so each question stands alone. Built in an n8n workshop, October 2026.</text>
</svg>
